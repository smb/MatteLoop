{
  "name": "Unsigned native packages",
  "on": {
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "matteloop-native-release",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native-package": {
      "name": "${{ matrix.target }}",
      "permissions": {
        "contents": "read"
      },
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "windows-2022-x64",
              "os": "windows-2022"
            },
            {
              "target": "macos-15-arm64",
              "os": "macos-15"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "Install uv and Python",
          "id": "setup-uv",
          "uses": "astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9",
          "with": {
            "enable-cache": false,
            "python-version": "3.13",
            "version": "0.11.32"
          }
        },
        {
          "name": "Install frozen dependencies",
          "run": "uv sync --frozen --all-groups"
        },
        {
          "name": "Build native standalone bundle",
          "run": "uv run --frozen --no-sync python scripts/build.py"
        },
        {
          "name": "Upload unsigned bundle",
          "id": "upload",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "MatteLoop-unsigned-${{ matrix.target }}",
            "path": "dist",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
