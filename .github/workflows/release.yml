{
  "name": "Unsigned native packages",
  "on": {
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "matteloop-native-release",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native-package": {
      "name": "${{ matrix.target }}",
      "permissions": {
        "contents": "read"
      },
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "windows-2022-x64",
              "os": "windows-2022"
            },
            {
              "target": "macos-15-arm64",
              "os": "macos-15"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "Install uv and Python",
          "id": "setup-uv",
          "uses": "astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9",
          "with": {
            "enable-cache": false,
            "python-version": "3.13",
            "version": "0.11.32"
          }
        },
        {
          "name": "Install macOS media build tools",
          "if": "runner.os == 'macOS'",
          "run": "if ! command -v cmake >/dev/null || ! command -v nasm >/dev/null || ! command -v pkg-config >/dev/null; then\n  brew install cmake nasm pkg-config\nfi"
        },
        {
          "name": "Configure MSVC amd64",
          "if": "runner.os == 'Windows'",
          "uses": "ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c",
          "with": {
            "arch": "amd64"
          }
        },
        {
          "name": "Install MSYS2 media build tools",
          "if": "runner.os == 'Windows'",
          "uses": "msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2",
          "with": {
            "msystem": "MSYS",
            "path-type": "inherit",
            "install": "base-devel make diffutils nasm pkgconf"
          }
        },
        {
          "name": "Cache media build stack",
          "uses": "actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae",
          "with": {
            "path": ".matteloop-build-cache/media-stack",
            "key": "media-stack-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('packaging/media-stack/manifest.toml', 'scripts/media_stack/**/*.py', 'scripts/build_media_stack.py', 'scripts/verify_media_stack.py') }}"
          }
        },
        {
          "name": "Install frozen dependencies",
          "run": "uv sync --frozen --all-groups"
        },
        {
          "name": "Build native standalone bundle",
          "run": "uv run --frozen --no-sync python scripts/build.py"
        },
        {
          "name": "Upload unsigned bundle",
          "id": "upload",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "MatteLoop-unsigned-${{ matrix.target }}",
            "path": "dist",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
