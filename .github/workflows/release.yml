{
  "name": "Unsigned native packages",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "platform": {
          "description": "Which platform(s) to build",
          "type": "choice",
          "default": "both",
          "options": [
            "both",
            "macos",
            "windows"
          ]
        }
      }
    },
    "push": {
      "tags": ["v*"],
      "branches": ["main"],
      "paths": [
        "packaging/media-stack/manifest.toml",
        "scripts/media_stack/**",
        "scripts/build_media_stack.py",
        "scripts/verify_media_stack.py"
      ]
    }
  },
  "concurrency": {
    "group": "matteloop-native-release",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "plan": {
      "runs-on": "ubuntu-22.04",
      "outputs": {
        "targets": "${{ steps.select.outputs.targets }}"
      },
      "steps": [
        {
          "id": "select",
          "run": "case \"${{ inputs.platform }}\" in\n  windows) targets='[{\"target\":\"windows-2022-x64\",\"os\":\"windows-2022\"}]' ;;\n  macos) targets='[{\"target\":\"macos-15-arm64\",\"os\":\"macos-15\"}]' ;;\n  *) targets='[{\"target\":\"windows-2022-x64\",\"os\":\"windows-2022\"},{\"target\":\"macos-15-arm64\",\"os\":\"macos-15\"}]' ;;\nesac\necho \"targets=$targets\" >> \"$GITHUB_OUTPUT\""
        }
      ]
    },
    "native-package": {
      "name": "${{ matrix.target }}",
      "needs": "plan",
      "permissions": {
        "contents": "read"
      },
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": "${{ fromJson(needs.plan.outputs.targets) }}"
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "Install uv and Python",
          "id": "setup-uv",
          "uses": "astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9",
          "with": {
            "enable-cache": false,
            "python-version": "3.13",
            "version": "0.11.32"
          }
        },
        {
          "name": "Install macOS media build tools",
          "if": "runner.os == 'macOS'",
          "run": "if ! command -v cmake >/dev/null || ! command -v nasm >/dev/null || ! command -v pkg-config >/dev/null; then\n  brew install cmake nasm pkg-config\nfi"
        },
        {
          "name": "Configure MSVC amd64",
          "if": "runner.os == 'Windows'",
          "uses": "ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c",
          "with": {
            "arch": "amd64"
          }
        },
        {
          "name": "Install MSYS2 media build tools",
          "if": "runner.os == 'Windows'",
          "uses": "msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2",
          "with": {
            "msystem": "MSYS",
            "path-type": "inherit",
            "install": "base-devel make diffutils nasm pkgconf"
          }
        },
        {
          "name": "Restore media build stack cache",
          "id": "media-stack-cache",
          "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae",
          "with": {
            "path": ".matteloop-build-cache/media-stack",
            "key": "media-stack-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('packaging/media-stack/manifest.toml', 'scripts/media_stack/**/*.py', 'scripts/build_media_stack.py', 'scripts/verify_media_stack.py') }}"
          }
        },
        {
          "name": "Install frozen dependencies",
          "run": "uv sync --frozen --all-groups"
        },
        {
          "name": "Restore Nuitka compile cache",
          "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae",
          "with": {
            "path": "~/.cache/Nuitka\n~/Library/Caches/Nuitka\n~\\AppData\\Local\\Nuitka\\Nuitka\\Cache",
            "key": "nuitka-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}",
            "restore-keys": "nuitka-${{ runner.os }}-${{ matrix.target }}-"
          }
        },
        {
          "name": "Build native standalone bundle",
          "run": "uv run --frozen --no-sync python scripts/build.py"
        },
        {
          "name": "Save media build stack cache",
          "if": "always() && steps.media-stack-cache.outputs.cache-hit != 'true'",
          "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae",
          "with": {
            "path": ".matteloop-build-cache/media-stack",
            "key": "media-stack-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('packaging/media-stack/manifest.toml', 'scripts/media_stack/**/*.py', 'scripts/build_media_stack.py', 'scripts/verify_media_stack.py') }}"
          }
        },
        {
          "name": "Save Nuitka compile cache",
          "if": "always()",
          "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae",
          "with": {
            "path": "~/.cache/Nuitka\n~/Library/Caches/Nuitka\n~\\AppData\\Local\\Nuitka\\Nuitka\\Cache",
            "key": "nuitka-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}"
          }
        },
        {
          "name": "Upload retained media-stack staging on failure",
          "if": "failure()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "media-stack-staging-${{ matrix.target }}",
            "path": "build-failure-diagnostics",
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Upload unsigned bundle",
          "id": "upload",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "MatteLoop-unsigned-${{ matrix.target }}",
            "path": "dist",
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "publish": {
      "needs": "native-package",
      "if": "startsWith(github.ref, 'refs/tags/v')",
      "runs-on": "ubuntu-22.04",
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "Download unsigned bundles",
          "uses": "actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0",
          "with": {
            "path": "bundles",
            "pattern": "MatteLoop-unsigned-*"
          }
        },
        {
          "name": "Separate the application from its LGPL source archives",
          "run": "mkdir -p assets\nfor bundle in bundles/MatteLoop-unsigned-*; do\n  target=\"${bundle##*/MatteLoop-unsigned-}\"\n  # The source archives beside the bundle are the LGPL corresponding\n  # sources; they ship as their own assets so the application download is\n  # not 90 MB heavier for every user. Whatever remains is the application.\n  find \"$bundle\" -maxdepth 1 -name \"MatteLoop-*-sources-*\" -exec mv {} assets/ \\;\n  (cd \"$bundle\" && zip -qry \"../../assets/MatteLoop-${GITHUB_REF_NAME}-${target}.zip\" .)\ndone\nls -lh assets"
        },
        {
          "name": "Create the draft release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh release create \"$GITHUB_REF_NAME\" assets/* \\\n  --repo \"$GITHUB_REPOSITORY\" \\\n  --draft \\\n  --title \"MatteLoop $GITHUB_REF_NAME\" \\\n  --notes 'Unsigned builds. Windows warns via SmartScreen and macOS needs a right-click Open on first launch.\n\nThe MatteLoop-*-sources-* archives are the complete corresponding sources for the LGPL libraries (FFmpeg, libwebp, Qt) inside the application, published here as required by their licences. They are not needed to run MatteLoop.'"
        }
      ]
    }
  }
}
