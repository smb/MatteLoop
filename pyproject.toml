[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rembggui"
dynamic = ["version"]
description = "A cross-platform desktop app for video background removal."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "rembgGUI contributors" }]
dependencies = [
  "PySide6~=6.10.1",
  "av>=16,<17",
  "Pillow>=12.1,<13",
  "numpy>=2.3,<3",
  "rembg[cpu]==2.0.72",
  "platformdirs>=4.3,<5",
]

[project.scripts]
rembggui = "rembggui.app:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "Nuitka==2.8.10",
  "patchelf==0.17.2.4; sys_platform == 'linux'",
  "pip>=25,<26",
  "psutil>=7,<8",
  "pytest>=8.3,<9",
  "pytest-qt>=4.5,<5",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rembggui"]

[tool.hatch.build.targets.wheel.force-include]
"resources/model-manifest.json" = "rembggui/resources/model-manifest.json"
"resources/model-provenance.json" = "rembggui/resources/model-provenance.json"
"resources/fonts/IBMPlexSans-Regular.ttf" = "rembggui/resources/fonts/IBMPlexSans-Regular.ttf"
"resources/fonts/IBMPlexSans-SemiBold.ttf" = "rembggui/resources/fonts/IBMPlexSans-SemiBold.ttf"
"resources/fonts/IBMPlexMono-Regular.ttf" = "rembggui/resources/fonts/IBMPlexMono-Regular.ttf"
"resources/fonts/OFL.txt" = "rembggui/resources/fonts/OFL.txt"

[tool.hatch.version]
path = "src/rembggui/__init__.py"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["av", "PIL"]
ignore_missing_imports = true
